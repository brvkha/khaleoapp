spring:
  config:
    activate:
      on-profile: staging

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:khaleoapp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.khaleo: INFO

app:
  auth:
    jwt:
      issuer: ${JWT_ISSUER:khaleo-staging}
      secret: ${JWT_SECRET:replace-with-staging-secret}

