spring:
  config:
    # Import secret từ file bên ngoài server (Rất tốt cho bảo mật)
    import: optional:file:/opt/khaleo/flashcard-backend/runtime-secrets.env[.properties]

  datasource:
    # Ở prod thường dùng connection pool lớn hơn hoặc cấu hình DB chặt chẽ hơn
    hikari:
      maximum-pool-size: 20

  jpa:
    show-sql: false # Tắt log SQL ở prod để tăng performance
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.flywaydb: INFO # Giảm bớt log ở prod
    org.hibernate.SQL: ERROR

app:
  runtime-secrets:
    db-secret-id: ${DB_SECRET_ID:khaleo/prod/db-credentials}
    jwt-secret-id: ${JWT_SECRET_ID:khaleo/prod/jwt-secret}
    ses-secret-id: ${SES_SECRET_ID:khaleo/prod/ses-credentials}

  auth:
    jwt:
      # Ở prod BẮT BUỘC phải đổi secret qua biến môi trường, không dùng default "change-me"
      secret: ${JWT_SECRET}
    email:
      provider: ${APP_EMAIL_PROVIDER:mock} # Chuyển từ mock sang AWS SES thực tế