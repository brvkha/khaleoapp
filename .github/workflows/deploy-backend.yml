name: Deploy Backend

on:
  workflow_call:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  PROJECT_NAME: khaleoapp
  DOCKER_IMAGE_NAME: brvkha/khaleoapp
  JDK_VERSION: '17'
  BACKEND_PORT: '8080'
  TARGET_ENV: prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve short SHA
        id: sha
        run: echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Record immutable backend artifact path
        run: echo "backend/${{ steps.sha.outputs.value }}/app.jar"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          cache: 'maven'

      - name: Build JAR
        working-directory: backend
        run: mvn -B -ntp clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS preflight
        run: |
          set -e
          echo "Region: ${{ env.AWS_REGION }}"
          aws sts get-caller-identity

      - name: Resolve EC2 instance id
        id: resolve_instance
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          INSTANCE_ID=$(echo "$INSTANCE_ID" | tr -d '\r' | xargs)

          if [ -z "$INSTANCE_ID" ]; then
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters \
                "Name=tag:Project,Values=${{ env.PROJECT_NAME }}" \
                "Name=tag:Environment,Values=prod" \
                "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].InstanceId | [0]' \
              --output text)
          fi

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Cannot resolve EC2 instance id. Set secret EC2_INSTANCE_ID or verify tags Project/Environment."
            exit 1
          fi

          INSTANCE_STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          if [ "$INSTANCE_STATE" != "running" ]; then
            echo "EC2 instance is not running: $INSTANCE_ID (state=$INSTANCE_STATE)"
            exit 1
          fi

          SSM_PING=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)

          if [ "$SSM_PING" != "Online" ]; then
            echo "EC2 instance is not SSM Online: $INSTANCE_ID (PingStatus=$SSM_PING)"
            echo "Check IAM instance profile AmazonSSMManagedInstanceCore, SSM agent, and outbound internet/NAT access."
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Bootstrap Nginx/TLS via SSM document
        run: |
            API_DOMAIN="${{ secrets.API_DOMAIN || 'api.khaleoshop.click' }}"
            TLS_EMAIL="${{ secrets.TLS_EMAIL }}"
            DOCUMENT_NAME="${{ env.PROJECT_NAME }}-prod-nginx-tls-bootstrap"

            if [ -n "$TLS_EMAIL" ]; then
              NGINX_COMMAND_ID=$(aws ssm send-command \
                --instance-ids "${{ steps.resolve_instance.outputs.instance_id }}" \
                --document-name "$DOCUMENT_NAME" \
                --comment "Bootstrap nginx/tls for $API_DOMAIN" \
                --parameters "ApiDomain=$API_DOMAIN,BackendPort=${{ env.BACKEND_PORT }},TlsEmail=$TLS_EMAIL" \
                --query "Command.CommandId" \
                --output text)
            else
              NGINX_COMMAND_ID=$(aws ssm send-command \
                --instance-ids "${{ steps.resolve_instance.outputs.instance_id }}" \
                --document-name "$DOCUMENT_NAME" \
                --comment "Bootstrap nginx/tls for $API_DOMAIN" \
                --parameters "ApiDomain=$API_DOMAIN,BackendPort=${{ env.BACKEND_PORT }}" \
                --query "Command.CommandId" \
                --output text)
            fi

            if [ -z "$NGINX_COMMAND_ID" ] || [ "$NGINX_COMMAND_ID" = "None" ]; then
              echo "Failed to create SSM command for nginx/tls bootstrap"
              exit 1
            fi

            for i in {1..40}; do
              STATUS=$(aws ssm list-command-invocations \
                --command-id "$NGINX_COMMAND_ID" \
                --details \
                --query "CommandInvocations[0].Status" \
                --output text)

              echo "Nginx/TLS bootstrap status: $STATUS"

              if [ "$STATUS" = "Success" ]; then
                break
              fi

              if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
                echo "Nginx/TLS bootstrap failed"
                aws ssm list-command-invocations \
                  --command-id "$NGINX_COMMAND_ID" \
                  --details \
                  --query "CommandInvocations[0].CommandPlugins[0].Output" \
                  --output text
                exit 1
              fi

              sleep 10
            done

      - name: Deploy backend container to EC2 via SSM
        run: |
             RDS_HOST="${{ secrets.RDS_HOST || secrets.RDS_HOST_PROD }}"
             if [ -z "$RDS_HOST" ]; then
               RDS_HOST=$(aws rds describe-db-instances \
                 --filters "Name=db-instance-id,Values=${{ env.PROJECT_NAME }}-prod-db" \
                 --query 'DBInstances[0].Endpoint.Address' \
                 --output text)
               echo "Auto-discovered RDS HOST: $RDS_HOST"
             fi

             RDS_DB_NAME="${{ secrets.RDS_DB_NAME || secrets.RDS_DB_NAME_PROD }}"
             RDS_DB_USER="${{ secrets.RDS_DB_USER || secrets.RDS_DB_USER_PROD }}"
             RDS_DB_PASSWORD="${{ secrets.RDS_DB_PASSWORD || secrets.RDS_DB_PASSWORD_PROD }}"
             JWT_SECRET="${{ secrets.JWT_SECRET || secrets.JWT_SECRET_PROD || 'khaleoapp-default-secure-jwt-secret-for-fallback-32-bytes' }}"

             # Create parameter array for SSM
             cat > /tmp/deploy_params.json <<'EOF'
             {
               "commands": [
                 "set -ex",
                 "echo '=== Deploying Backend ===' && date",
                 "docker login -u DOCKER_USER -p DOCKER_PASS",
                 "docker pull DOCKER_IMAGE:SHA",
                 "docker stop khaleo-backend 2>/dev/null || true && docker rm khaleo-backend 2>/dev/null || true",
                 "docker run -d --restart unless-stopped --name khaleo-backend -p 8080:8080 -e SPRING_PROFILES_ACTIVE=prod -e SPRING_JPA_HIBERNATE_DDL_AUTO=validate -e DB_HOST=DB_HOST_VAL -e DB_NAME=DB_NAME_VAL -e DB_USERNAME=DB_USER_VAL -e DB_PASSWORD='DB_PASS_VAL' -e JWT_SECRET='JWT_VAL' DOCKER_IMAGE:SHA",
                 "sleep 10",
                 "docker ps --filter name=khaleo-backend",
                 "docker logs --tail 50 khaleo-backend 2>&1 || echo 'Logs not available'",
                 "curl -s http://127.0.0.1:8080/actuator/health | head -c 200 || echo 'Health check timeout'"
               ]
             }
             EOF

             # Replace parameters
             sed -i "s|DOCKER_USER|${{ secrets.DOCKERHUB_USERNAME }}|g" /tmp/deploy_params.json
             sed -i "s|DOCKER_PASS|${{ secrets.DOCKERHUB_TOKEN }}|g" /tmp/deploy_params.json
             sed -i "s|DOCKER_IMAGE|${{ env.DOCKER_IMAGE_NAME }}|g" /tmp/deploy_params.json
             sed -i "s|SHA|${{ github.sha }}|g" /tmp/deploy_params.json
             sed -i "s|DB_HOST_VAL|$RDS_HOST|g" /tmp/deploy_params.json
             sed -i "s|DB_NAME_VAL|$RDS_DB_NAME|g" /tmp/deploy_params.json
             sed -i "s|DB_USER_VAL|$RDS_DB_USER|g" /tmp/deploy_params.json
             sed -i "s|DB_PASS_VAL|$RDS_DB_PASSWORD|g" /tmp/deploy_params.json
             sed -i "s|JWT_VAL|$JWT_SECRET|g" /tmp/deploy_params.json

             # Send SSM command
             COMMAND_ID=$(aws ssm send-command \
               --instance-ids "${{ steps.resolve_instance.outputs.instance_id }}" \
               --document-name "AWS-RunShellScript" \
               --parameters file:///tmp/deploy_params.json \
               --region ${{ env.AWS_REGION }} \
               --query "Command.CommandId" \
               --output text)

             echo "SSM Command ID: $COMMAND_ID"

             # Wait for command
             for i in {1..120}; do
               STATUS=$(aws ssm list-command-invocations \
                 --command-id "$COMMAND_ID" \
                 --details \
                 --region ${{ env.AWS_REGION }} \
                 --query "CommandInvocations[0].Status" \
                 --output text 2>/dev/null || echo "Pending")
               
               echo "[$i/120] Status: $STATUS"
               
               if [ "$STATUS" = "Success" ]; then
                 echo "✓ Deployment completed successfully"
                 aws ssm get-command-invocation \
                   --command-id "$COMMAND_ID" \
                   --instance-id "${{ steps.resolve_instance.outputs.instance_id }}" \
                   --region ${{ env.AWS_REGION }} \
                   --query 'StandardOutputContent' --output text | tail -50
                 break
               fi
               
               if [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut)$ ]]; then
                 echo "✗ Deployment failed with status: $STATUS"
                 aws ssm get-command-invocation \
                   --command-id "$COMMAND_ID" \
                   --instance-id "${{ steps.resolve_instance.outputs.instance_id }}" \
                   --region ${{ env.AWS_REGION }} \
                   --output text | head -200
                 exit 1
               fi
               
               sleep 5
             done

      - name: Rollback Guidance
        if: failure()
        run: |
          echo "Rollback Guidance: redeploy previous immutable artifact or rerun workflow with last known-good SHA."

      - name: Notify success
        if: success()
        run: |
          echo "Backend deployed to ${TARGET_ENV}"
