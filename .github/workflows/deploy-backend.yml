name: Deploy Backend

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  DOCKER_IMAGE_NAME: brvkha/khaleoapp
  JDK_VERSION: '17'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          cache: 'maven'

      - name: Build JAR
        working-directory: backend
        run: mvn -B -ntp clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max

      - name: Deploy to EC2
        run: |
          mkdir -p ~/.ssh
          # Sử dụng printf để giữ nguyên định dạng xuống dòng của Private Key
          printf "%s" "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          ssh -T -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_SSH_USER }}@${{ secrets.EC2_HOST_STAGING }} << 'EOFSH'
          set -e
          echo "Pulling Docker image..."
          docker pull ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          
          echo "Stopping old container..."
          docker stop khaleo-backend || true
          docker rm khaleo-backend || true
          
          echo "Starting new container..."
          docker run -d \
            --name khaleo-backend \
            -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=staging \
            -e DB_HOST=${{ secrets.RDS_HOST_STAGING }} \
            -e DB_NAME=${{ secrets.RDS_DB_NAME }} \
            -e DB_USERNAME=${{ secrets.RDS_DB_USER }} \
            -e DB_PASSWORD=${{ secrets.RDS_DB_PASSWORD }} \
            -e JWT_SECRET=${{ secrets.JWT_SECRET_STAGING }} \
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          
          echo "Waiting for container to be ready..."
          sleep 5
          docker ps -a | grep khaleo-backend
          EOFSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Notify success
        if: success()
        run: |
          echo "Backend deployed to staging from develop"

