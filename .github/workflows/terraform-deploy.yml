name: Main Deployment Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'infra/terraform/**'
      - '.github/workflows/terraform-deploy.yml'
      - '.github/workflows/deploy-frontend.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy to production after successful staging and approval
        required: true
        type: boolean
        default: true
      deploy_mode:
        description: full = run from Phase 1; prod_only = skip to prod lane
        required: true
        type: choice
        default: full
        options:
          - full
          - prod_only

permissions:
  contents: read

concurrency:
  group: main-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  PROJECT_NAME: khaleoapp
  TF_BOOTSTRAP_DIR: infra/terraform/bootstrap
  TF_APP_DIR: infra/terraform/app
  ROUTE53_ZONE_NAME: khaleoshop.click

jobs:
  phase1_validate:
    name: Phase 1 - Build and Test
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm run test

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: mvn -B -ntp test

  terraform_staging:
    name: Phase 2 - Terraform Staging
    runs-on: ubuntu-latest
    needs: phase1_validate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full' }}
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render staging CI tfvars and backend config
        run: |
          set -euo pipefail

          TF_STATE_BUCKET="${{ secrets.TF_STATE_BUCKET || secrets.TF_STATE_BUCKET_PROD || secrets.TF_STATE_BUCKET_STAGING }}"
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "Missing Terraform state bucket secret for staging"
            exit 1
          fi

          TF_LOCK_TABLE="${{ secrets.TF_LOCK_TABLE || secrets.TF_LOCK_TABLE_PROD || secrets.TF_LOCK_TABLE_STAGING }}"
          if [ -z "$TF_LOCK_TABLE" ]; then
            TF_LOCK_TABLE="${PROJECT_NAME}-terraform-lock-staging"
          fi

          TF_BACKEND_KEY="${{ secrets.TF_BACKEND_KEY || secrets.TF_BACKEND_KEY_PROD || secrets.TF_BACKEND_KEY_STAGING }}"
          if [ -z "$TF_BACKEND_KEY" ]; then
            TF_BACKEND_KEY="${PROJECT_NAME}/staging/terraform.tfstate"
          fi

          TF_BOOTSTRAP_BACKEND_KEY="${{ secrets.TF_BOOTSTRAP_BACKEND_KEY || secrets.TF_BOOTSTRAP_BACKEND_KEY_PROD || secrets.TF_BOOTSTRAP_BACKEND_KEY_STAGING }}"
          if [ -z "$TF_BOOTSTRAP_BACKEND_KEY" ]; then
            TF_BOOTSTRAP_BACKEND_KEY="${PROJECT_NAME}/staging/bootstrap.tfstate"
          fi

          TLS_EMAIL="${{ secrets.TLS_EMAIL || secrets.TLS_EMAIL_PROD || secrets.TLS_EMAIL_STAGING }}"
          RDS_DB_NAME="${{ secrets.RDS_DB_NAME || secrets.RDS_DB_NAME_PROD }}"
          RDS_DB_USER="${{ secrets.RDS_DB_USER || secrets.RDS_DB_USER_PROD }}"
          RDS_DB_PASSWORD="${{ secrets.RDS_DB_PASSWORD || secrets.RDS_DB_PASSWORD_PROD }}"

          if [ -z "$RDS_DB_NAME" ] || [ -z "$RDS_DB_USER" ] || [ -z "$RDS_DB_PASSWORD" ]; then
            echo "Missing required production DB secrets (RDS_DB_NAME/RDS_DB_USER/RDS_DB_PASSWORD)"
            exit 1
          fi

          cat > "${TF_BOOTSTRAP_DIR}/ci.auto.tfvars" <<EOF
          aws_region           = "${AWS_REGION}"
          project              = "${PROJECT_NAME}"
          tf_state_bucket_name = "${TF_STATE_BUCKET}"
          tf_lock_table_name   = "${TF_LOCK_TABLE}"
          EOF

          cat > "${TF_BOOTSTRAP_DIR}/backend-staging.hcl" <<EOF
          bucket         = "${TF_STATE_BUCKET}"
          key            = "${TF_BOOTSTRAP_BACKEND_KEY}"
          region         = "${AWS_REGION}"
          dynamodb_table = "${TF_LOCK_TABLE}"
          encrypt        = true
          EOF

          cat > "${TF_APP_DIR}/backend-staging.hcl" <<EOF
          bucket         = "${TF_STATE_BUCKET}"
          key            = "${TF_BACKEND_KEY}"
          region         = "${AWS_REGION}"
          dynamodb_table = "${TF_LOCK_TABLE}"
          encrypt        = true
          EOF

          cat > "${TF_APP_DIR}/env/ci.staging.tfvars" <<EOF
          aws_region                    = "${AWS_REGION}"
          project                       = "${PROJECT_NAME}"
          environment                   = "staging"
          vpc_cidr                      = "10.0.0.0/16"
          public_subnet_cidr            = "10.0.1.0/24"
          private_subnet_a_cidr         = "10.0.2.0/24"
          private_subnet_b_cidr         = "10.0.3.0/24"
          route53_zone_name             = "${ROUTE53_ZONE_NAME}"
          frontend_domain_name          = "staging.${ROUTE53_ZONE_NAME}"
          frontend_additional_domain_names = ["stage.${ROUTE53_ZONE_NAME}"]
          api_domain_name               = "api-staging.${ROUTE53_ZONE_NAME}"
          backend_container_port        = 8080
          tls_email                     = "${TLS_EMAIL}"
          ec2_instance_type             = "t3.micro"
          db_instance_class             = "db.t3.micro"
          db_name                       = "${RDS_DB_NAME}"
          db_username                   = "${RDS_DB_USER}"
          db_password                   = "${RDS_DB_PASSWORD}"
          db_backup_retention_days      = 7
          allowed_http_cidrs            = ["0.0.0.0/0"]
          enable_frontend_custom_domain = true
          EOF

      - name: Terraform validate staging modules
        run: |
          terraform -chdir="${TF_BOOTSTRAP_DIR}" fmt -check -recursive
          terraform -chdir="${TF_APP_DIR}" fmt -check -recursive
          terraform -chdir="${TF_BOOTSTRAP_DIR}" init -backend=false -input=false
          terraform -chdir="${TF_BOOTSTRAP_DIR}" validate
          terraform -chdir="${TF_APP_DIR}" init -backend=false -input=false
          terraform -chdir="${TF_APP_DIR}" validate

      - name: Terraform apply staging
        run: |
          terraform -chdir="${TF_BOOTSTRAP_DIR}" init -reconfigure -backend-config="backend-staging.hcl" -input=false
          terraform -chdir="${TF_BOOTSTRAP_DIR}" apply -input=false -auto-approve
          terraform -chdir="${TF_APP_DIR}" init -reconfigure -backend-config="backend-staging.hcl" -input=false
          terraform -chdir="${TF_APP_DIR}" apply -input=false -auto-approve -var-file="env/ci.staging.tfvars"

  deploy_frontend_staging:
    name: Phase 2 - Deploy Frontend Staging
    needs: terraform_staging
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full' }}
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      target_environment: staging
    secrets: inherit

  deploy_backend_staging:
    name: Phase 2 - Deploy Backend Staging
    needs: terraform_staging
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full' }}
    uses: ./.github/workflows/deploy-backend.yml
    with:
      target_environment: staging
    secrets: inherit

  staging_ready:
    name: Phase 2 - Staging Completed
    runs-on: ubuntu-latest
    needs: [deploy_frontend_staging, deploy_backend_staging]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_mode == 'full' }}
    steps:
      - name: Confirm staging deployment
        run: echo "Staging Terraform + app deployment completed successfully."

  staging_bypass:
    name: Phase 2 - Staging Bypassed
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mode == 'prod_only' }}
    steps:
      - name: Confirm prod-only mode
        run: echo "Skipping Phase 1 + staging. Proceeding to production approval."

  approval_production:
    name: Manual Approval for Production
    runs-on: ubuntu-latest
    needs: [staging_ready, staging_bypass]
    if: ${{
      always() &&
      (github.event_name == 'push' || inputs.deploy_production == true) &&
      (
        (github.event_name != 'workflow_dispatch' && needs.staging_ready.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_mode == 'full' && needs.staging_ready.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_mode == 'prod_only' && needs.staging_bypass.result == 'success')
      )
      }}
    environment:
      name: prod
    steps:
      - name: Wait for production approval
        run: echo "Production approval granted."

  terraform_prod:
    name: Phase 3 - Terraform Production
    runs-on: ubuntu-latest
    needs: approval_production
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render production CI tfvars and backend config
        run: |
          set -euo pipefail

          TF_STATE_BUCKET="${{ secrets.TF_STATE_BUCKET }}"
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "Missing Terraform state bucket secret for production"
            exit 1
          fi

          TF_LOCK_TABLE="${{ secrets.TF_LOCK_TABLE }}"
          if [ -z "$TF_LOCK_TABLE" ]; then
            TF_LOCK_TABLE="${PROJECT_NAME}-terraform-lock-prod"
          fi

          TF_BACKEND_KEY="${{ secrets.TF_BACKEND_KEY }}"
          if [ -z "$TF_BACKEND_KEY" ]; then
            TF_BACKEND_KEY="${PROJECT_NAME}/prod/terraform.tfstate"
          fi

          TF_BOOTSTRAP_BACKEND_KEY="${{ secrets.TF_BOOTSTRAP_BACKEND_KEY }}"
          if [ -z "$TF_BOOTSTRAP_BACKEND_KEY" ]; then
            TF_BOOTSTRAP_BACKEND_KEY="${PROJECT_NAME}/prod/bootstrap.tfstate"
          fi

          TLS_EMAIL="${{ secrets.TLS_EMAIL }}"
          RDS_DB_NAME="${{ secrets.RDS_DB_NAME }}"
          RDS_DB_USER="${{ secrets.RDS_DB_USER }}"
          RDS_DB_PASSWORD="${{ secrets.RDS_DB_PASSWORD }}"

          cat > "${TF_BOOTSTRAP_DIR}/ci.auto.tfvars" <<EOF
          aws_region           = "${AWS_REGION}"
          project              = "${PROJECT_NAME}"
          tf_state_bucket_name = "${TF_STATE_BUCKET}"
          tf_lock_table_name   = "${TF_LOCK_TABLE}"
          EOF

          cat > "${TF_BOOTSTRAP_DIR}/backend-prod.hcl" <<EOF
          bucket         = "${TF_STATE_BUCKET}"
          key            = "${TF_BOOTSTRAP_BACKEND_KEY}"
          region         = "${AWS_REGION}"
          dynamodb_table = "${TF_LOCK_TABLE}"
          encrypt        = true
          EOF

          cat > "${TF_APP_DIR}/backend-prod.hcl" <<EOF
          bucket         = "${TF_STATE_BUCKET}"
          key            = "${TF_BACKEND_KEY}"
          region         = "${AWS_REGION}"
          dynamodb_table = "${TF_LOCK_TABLE}"
          encrypt        = true
          EOF

          cat > "${TF_APP_DIR}/env/ci.prod.tfvars" <<EOF
          aws_region                    = "${AWS_REGION}"
          project                       = "${PROJECT_NAME}"
          environment                   = "prod"
          vpc_cidr                      = "10.1.0.0/16"
          public_subnet_cidr            = "10.1.1.0/24"
          private_subnet_a_cidr         = "10.1.2.0/24"
          private_subnet_b_cidr         = "10.1.3.0/24"
          route53_zone_name             = "${ROUTE53_ZONE_NAME}"
          frontend_domain_name          = "${ROUTE53_ZONE_NAME}"
          frontend_additional_domain_names = ["www.${ROUTE53_ZONE_NAME}"]
          api_domain_name               = "api.${ROUTE53_ZONE_NAME}"
          backend_container_port        = 8080
          tls_email                     = "${TLS_EMAIL}"
          ec2_instance_type             = "t3.micro"
          db_instance_class             = "db.t3.micro"
          db_name                       = "${RDS_DB_NAME}"
          db_username                   = "${RDS_DB_USER}"
          db_password                   = "${RDS_DB_PASSWORD}"
          db_backup_retention_days      = 7
          allowed_http_cidrs            = ["0.0.0.0/0"]
          enable_frontend_custom_domain = true
          EOF

      - name: Terraform validate production modules
        run: |
          terraform -chdir="${TF_BOOTSTRAP_DIR}" fmt -check -recursive
          terraform -chdir="${TF_APP_DIR}" fmt -check -recursive
          terraform -chdir="${TF_BOOTSTRAP_DIR}" init -backend=false -input=false
          terraform -chdir="${TF_BOOTSTRAP_DIR}" validate
          terraform -chdir="${TF_APP_DIR}" init -backend=false -input=false
          terraform -chdir="${TF_APP_DIR}" validate

      - name: Terraform apply production
        run: |
          TF_STATE_BUCKET="${{ secrets.TF_STATE_BUCKET || secrets.TF_STATE_BUCKET_PROD || secrets.TF_STATE_BUCKET_STAGING }}"
          TF_LOCK_TABLE="${{ secrets.TF_LOCK_TABLE || secrets.TF_LOCK_TABLE_PROD || secrets.TF_LOCK_TABLE_STAGING }}"
          if [ -z "$TF_LOCK_TABLE" ]; then
            TF_LOCK_TABLE="${PROJECT_NAME}-terraform-lock"
          fi

          aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null || aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "${AWS_REGION}" --create-bucket-configuration LocationConstraint="${AWS_REGION}"
          aws s3api put-bucket-versioning --bucket "$TF_STATE_BUCKET" --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket "$TF_STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block --bucket "$TF_STATE_BUCKET" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" >/dev/null 2>&1 || aws dynamodb create-table --table-name "$TF_LOCK_TABLE" --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH --billing-mode PAY_PER_REQUEST
          aws dynamodb wait table-exists --table-name "$TF_LOCK_TABLE"

          terraform -chdir="${TF_BOOTSTRAP_DIR}" init -reconfigure -backend-config="backend-prod.hcl" -input=false

          import_if_exists() {
            local address="$1"
            local resource_id="$2"
            terraform -chdir="${TF_BOOTSTRAP_DIR}" import -input=false "$address" "$resource_id" || true
          }

          import_if_exists "aws_s3_bucket.tf_state" "$TF_STATE_BUCKET"
          import_if_exists "aws_s3_bucket_versioning.tf_state" "$TF_STATE_BUCKET"
          import_if_exists "aws_s3_bucket_server_side_encryption_configuration.tf_state" "$TF_STATE_BUCKET"
          import_if_exists "aws_s3_bucket_public_access_block.tf_state" "$TF_STATE_BUCKET"
          import_if_exists "aws_dynamodb_table.tf_lock" "$TF_LOCK_TABLE"
          import_if_exists 'aws_cloudwatch_log_group.ssm_session[0]' "/aws/ssm/${PROJECT_NAME}/session"
          import_if_exists 'aws_ssm_document.session_preferences[0]' "SSM-SessionManagerRunShell"

          terraform -chdir="${TF_BOOTSTRAP_DIR}" apply -input=false -auto-approve
          terraform -chdir="${TF_APP_DIR}" init -reconfigure -backend-config="backend-prod.hcl" -input=false
          terraform -chdir="${TF_APP_DIR}" apply -input=false -auto-approve -var-file="env/ci.prod.tfvars"

  deploy_frontend_prod:
    name: Phase 3 - Deploy Frontend Production
    needs: terraform_prod
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      target_environment: prod
    secrets: inherit

  deploy_backend_prod:
    name: Phase 3 - Deploy Backend Production
    needs: terraform_prod
    uses: ./.github/workflows/deploy-backend.yml
    with:
      target_environment: prod
    secrets: inherit
