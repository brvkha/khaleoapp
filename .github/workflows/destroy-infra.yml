name: Destroy Staging Infra (DANGER)

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Gõ chính xác chữ "DESTROY" để xác nhận phá hủy'
        required: true
        default: 'NO'
      destroy_backend_state:
        description: 'Xóa luôn S3 state + DynamoDB lock table? (tìm "DESTROY_BACKEND")'
        required: false
        default: 'NO'

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  PROJECT_NAME: khaleoapp
  TF_ENV: staging
  TF_APP_DIR: infra/terraform/app
  ROUTE53_ZONE_NAME: khaleoshop.click
  FRONTEND_DOMAIN_NAME: staging.khaleoshop.click
  FRONTEND_ADDITIONAL_DOMAIN_NAME: stage.khaleoshop.click
  API_DOMAIN_NAME: api-staging.khaleoshop.click

jobs:
  destroy-infra:
    name: Nuke Staging Environment
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ github.event.inputs.confirm_destroy == 'DESTROY' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render CI tfvars and backend config
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.TF_STATE_BUCKET }}" ]; then
            echo "Missing required secret: TF_STATE_BUCKET"
            exit 1
          fi

          TF_LOCK_TABLE="${{ secrets.TF_LOCK_TABLE }}"
          if [ -z "$TF_LOCK_TABLE" ]; then
            TF_LOCK_TABLE="khaleoapp-terraform-lock"
          fi

          TF_BACKEND_KEY="${{ secrets.TF_BACKEND_KEY }}"
          if [ -z "$TF_BACKEND_KEY" ]; then
            TF_BACKEND_KEY="khaleoapp/staging/terraform.tfstate"
          fi

          cat > "${TF_APP_DIR}/backend-staging.hcl" <<EOF
          bucket         = "${{ secrets.TF_STATE_BUCKET }}"
          key            = "${TF_BACKEND_KEY}"
          region         = "${AWS_REGION}"
          dynamodb_table = "${TF_LOCK_TABLE}"
          encrypt        = true
          EOF

          cat > "${TF_APP_DIR}/env/ci.staging.tfvars" <<EOF
          aws_region                    = "${AWS_REGION}"
          project                       = "${PROJECT_NAME}"
          environment                   = "${TF_ENV}"
          vpc_cidr                      = "10.0.0.0/16"
          public_subnet_cidr            = "10.0.1.0/24"
          private_subnet_a_cidr         = "10.0.2.0/24"
          private_subnet_b_cidr         = "10.0.3.0/24"
          route53_zone_name             = "${ROUTE53_ZONE_NAME}"
          frontend_domain_name          = "${FRONTEND_DOMAIN_NAME}"
          frontend_additional_domain_names = ["${FRONTEND_ADDITIONAL_DOMAIN_NAME}"]
          api_domain_name               = "${API_DOMAIN_NAME}"
          backend_container_port        = 8080
          tls_email                     = "${{ secrets.TLS_EMAIL }}"
          ec2_instance_type             = "t3.micro"
          db_instance_class             = "db.t3.micro"
          db_name                       = "${{ secrets.RDS_DB_NAME }}"
          db_username                   = "${{ secrets.RDS_DB_USER }}"
          db_password                   = "${{ secrets.RDS_DB_PASSWORD }}"
          db_backup_retention_days      = 7
          allowed_http_cidrs            = ["0.0.0.0/0"]
          enable_frontend_custom_domain = true
          EOF

      - name: Terraform App Init
        working-directory: ${{ env.TF_APP_DIR }}
        run: terraform init -reconfigure -backend-config="backend-staging.hcl" -input=false

      - name: Empty S3 buckets before destroy
        shell: bash
        run: |
          set -euo pipefail
          
          echo "🔍 Listing all S3 buckets with project prefix..."
          BUCKETS=$(aws s3 ls | grep -E "khaleo|staging" | awk '{print $3}' || true)
          
          if [ -z "$BUCKETS" ]; then
            echo "✅ Không tìm thấy S3 buckets cần empty"
          else
            echo "Found buckets to empty:"
            echo "$BUCKETS"
            
            for bucket in $BUCKETS; do
              # Không empty terraform state bucket nếu vẫn cần giữ backend
              if [[ "$bucket" == *"terraform"* ]] && [[ "${{ github.event.inputs.destroy_backend_state }}" != "DESTROY_BACKEND" ]]; then
                echo "⏭️  Skipping backend bucket: $bucket"
                continue
              fi
              
              echo "🗑️  Emptying bucket: $bucket"
              
              # Empty all versions (versioned buckets)
              aws s3api delete-objects \
                --bucket "$bucket" \
                --delete "$(aws s3api list-object-versions --bucket "$bucket" --query='{"Objects": [.Versions[].[Key,VersionId]][0]}' --output=json)" 2>/dev/null || true
              
              # Empty remaining objects
              aws s3 rm "s3://$bucket" --recursive 2>/dev/null || true
              
              echo "✅ Emptied: $bucket"
            done
          fi

      - name: Terraform App Destroy
        working-directory: ${{ env.TF_APP_DIR }}
        run: terraform destroy -input=false -auto-approve -var-file="env/ci.staging.tfvars"

      - name: Destroy Terraform Backend (Optional)
        if: ${{ github.event.inputs.destroy_backend_state == 'DESTROY_BACKEND' }}
        shell: bash
        run: |
          set -euo pipefail
          
          TF_STATE_BUCKET="${{ secrets.TF_STATE_BUCKET }}"
          TF_LOCK_TABLE="${{ secrets.TF_LOCK_TABLE }}"
          if [ -z "$TF_LOCK_TABLE" ]; then
            TF_LOCK_TABLE="khaleoapp-terraform-lock"
          fi
          
          echo "🗑️  Emptying Terraform state bucket: $TF_STATE_BUCKET"
          aws s3 rm "s3://$TF_STATE_BUCKET" --recursive || true
          
          echo "🗑️  Deleting Terraform lock table: $TF_LOCK_TABLE"
          aws dynamodb delete-table --table-name "$TF_LOCK_TABLE" 2>/dev/null || echo "⚠️  Lock table not found or already deleted"
          
          echo "🗑️  Deleting Terraform state bucket: $TF_STATE_BUCKET"
          aws s3 rb "s3://$TF_STATE_BUCKET" --force 2>/dev/null || echo "⚠️  State bucket not found or still has versions"
          
          echo "✅ Terraform backend destroyed"

      - name: Summary
        if: always()
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "💀 STAGING INFRASTRUCTURE DESTRUCTION COMPLETE"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          if [[ "${{ github.event.inputs.destroy_backend_state }}" == "DESTROY_BACKEND" ]]; then
            echo "✅ Đã xóa toàn bộ infra + Terraform state backend"
            echo "📝 Khi apply lại, toàn bộ sẽ được tạo lại từ đầu"
          else
            echo "✅ Đã xóa toàn bộ app infra (EC2, RDS, ALB, CloudFront...)"
            echo "ℹ️  Terraform state backend (S3 + DynamoDB) được giữ lại"
            echo "⚡ Apply tiếp theo sẽ nhanh hơn nhưng vẫn phải import resources mới"
          fi
          echo ""
          echo "🔄 Để tạo lại infrastructurẻ:"
          echo "   cd infra/terraform/app"
          echo "   terraform apply -var-file=env/ci.staging.tfvars"
          echo "═══════════════════════════════════════════════════════════"
