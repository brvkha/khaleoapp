name: Emergency AWS Cleanup (STATE-FREE DANGER)

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Gõ chính xác chữ "DESTROY" để xác nhận phá hủy'
        required: true
        default: 'NO'
      destroy_backend_state:
        description: 'Xóa luôn S3 state + DynamoDB lock table? (tìm "DESTROY_BACKEND")'
        required: false
        default: 'NO'

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  PROJECT_NAME: khaleoapp
  ENVIRONMENT: prod
  HOSTED_ZONE_ID: Z09479913APS5DRNMZYZ3
  FRONTEND_BUCKET: khaleoapp-prod-frontend-817888697629
  CLOUDFRONT_DISTRIBUTION_ID: E3SCOR5XMR0TOY
  EC2_INSTANCE_ID: i-0fa666265f036c141
  RDS_INSTANCE_ID: khaleoapp-prod-db
  TF_STATE_BUCKET: khaleoapp-tf-state-20260410
  TF_STATE_KEY: khaleoapp/prod/terraform.tfstate
  TF_LOCK_TABLE: khaleoapp-terraform-lock
  EC2_ROLE_NAME: khaleoapp-prod-ec2-ssm-role
  EC2_INSTANCE_PROFILE_NAME: khaleoapp-prod-instance-profile
  SSM_DOCUMENT_NAME: khaleoapp-prod-nginx-tls-bootstrap
  FRONTEND_ACM_DOMAIN: khaleoshop.click
  FRONTEND_ACM_ALT_DOMAIN: www.khaleoshop.click
  FRONTEND_OAC_NAME: khaleoapp-prod-oac
  SSM_SESSION_LOG_GROUP: /aws/ssm/khaleoapp/session

jobs:
  destroy-infra:
    name: Emergency Production Cleanup
    runs-on: ubuntu-latest
    environment: prod
    if: ${{ github.event.inputs.confirm_destroy == 'DESTROY' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run emergency cleanup
        shell: bash
        env:
          DESTROY_BACKEND_STATE: ${{ github.event.inputs.destroy_backend_state }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/emergency-cleanup.sh
          ./.github/scripts/emergency-cleanup.sh

      - name: Summary
        if: always()
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "💀 STATE-FREE EMERGENCY CLEANUP COMPLETE"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          if [[ "${{ github.event.inputs.destroy_backend_state }}" == "DESTROY_BACKEND" ]]; then
            echo "✅ Đã xóa toàn bộ AWS resources + Terraform backend"
            echo "📝 Không còn phụ thuộc Terraform state"
          else
            echo "✅ Đã dọn sạch AWS resources chính theo danh sách cố định"
            echo "ℹ️  Terraform backend được giữ lại"
          fi
          echo ""
          echo "🔄 Nếu muốn dựng lại, hãy bootstrap backend trước rồi apply Terraform"
          echo "═══════════════════════════════════════════════════════════"
