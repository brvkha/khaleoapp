name: Terraform Prod Infra

on:
  push:
    branches:
      - main
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-prod.yml'
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        required: true
        default: apply
        options:
          - apply
          - destroy
          - recreate
      auto_approve:
        description: "Apply/Destroy automatically without interactive approval"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  PROJECT_NAME: khaleoapp
  TF_ENV: prod
  TF_BOOTSTRAP_DIR: infra/terraform/bootstrap
  TF_APP_DIR: infra/terraform/app
  ROUTE53_ZONE_NAME: khaleoshop.click
  FRONTEND_DOMAIN_NAME: khaleoshop.click
  FRONTEND_ADDITIONAL_DOMAIN_NAME: www.khaleoshop.click
  API_DOMAIN_NAME: api-khaleoshop.click

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      tf_action: ${{ steps.deploy_chain.outputs.tf_action }}
      auto_approve: ${{ steps.deploy_chain.outputs.auto_approve }}
      should_trigger: ${{ steps.deploy_chain.outputs.should_trigger }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render CI tfvars and backend config
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.TF_STATE_BUCKET_PROD }}" ]; then
            echo "Missing required secret: TF_STATE_BUCKET_PROD"
            exit 1
          fi

          TF_LOCK_TABLE="${{ secrets.TF_LOCK_TABLE_PROD }}"
          if [ -z "$TF_LOCK_TABLE" ]; then
            TF_LOCK_TABLE="khaleoapp-terraform-lock"
          fi

          TF_BACKEND_KEY="${{ secrets.TF_BACKEND_KEY_PROD }}"
          if [ -z "$TF_BACKEND_KEY" ]; then
            TF_BACKEND_KEY="khaleoapp/prod/terraform.tfstate"
          fi

          TF_BOOTSTRAP_BACKEND_KEY="${{ secrets.TF_BOOTSTRAP_BACKEND_KEY_PROD }}"
          if [ -z "$TF_BOOTSTRAP_BACKEND_KEY" ]; then
            TF_BOOTSTRAP_BACKEND_KEY="khaleoapp/prod/bootstrap.tfstate"
          fi

          TLS_EMAIL="${{ secrets.TLS_EMAIL_PROD }}"
          DB_NAME="${{ secrets.RDS_DB_NAME }}"
          if [ -z "$DB_NAME" ]; then
            DB_NAME="khaleoapp"
          fi

          DB_USER="${{ secrets.RDS_DB_USER }}"
          if [ -z "$DB_USER" ]; then
            DB_USER="app_user"
          fi

          if [ -z "${{ secrets.RDS_DB_PASSWORD }}" ]; then
            echo "Missing required secret: RDS_DB_PASSWORD"
            exit 1
          fi

          cat > "${TF_BOOTSTRAP_DIR}/ci.auto.tfvars" <<EOF
          aws_region           = "${AWS_REGION}"
          project              = "${PROJECT_NAME}"
          tf_state_bucket_name = "${{ secrets.TF_STATE_BUCKET_PROD }}"
          tf_lock_table_name   = "${TF_LOCK_TABLE}"
          EOF

          cat > "${TF_BOOTSTRAP_DIR}/backend-prod.hcl" <<EOF
          bucket         = "${{ secrets.TF_STATE_BUCKET_PROD }}"
          key            = "${TF_BOOTSTRAP_BACKEND_KEY}"
          region         = "${AWS_REGION}"
          dynamodb_table = "${TF_LOCK_TABLE}"
          encrypt        = true
          EOF

          cat > "${TF_APP_DIR}/backend-prod.hcl" <<EOF
          bucket         = "${{ secrets.TF_STATE_BUCKET_PROD }}"
          key            = "${TF_BACKEND_KEY}"
          region         = "${AWS_REGION}"
          dynamodb_table = "${TF_LOCK_TABLE}"
          encrypt        = true
          EOF

          cat > "${TF_APP_DIR}/env/ci.prod.tfvars" <<EOF
          aws_region                    = "${AWS_REGION}"
          project                       = "${PROJECT_NAME}"
          environment                   = "${TF_ENV}"
          vpc_cidr                      = "10.0.0.0/16"
          public_subnet_cidr            = "10.0.1.0/24"
          private_subnet_a_cidr         = "10.0.2.0/24"
          private_subnet_b_cidr         = "10.0.3.0/24"
          route53_zone_name             = "${ROUTE53_ZONE_NAME}"
          frontend_domain_name          = "${FRONTEND_DOMAIN_NAME}"
          frontend_additional_domain_names = ["${FRONTEND_ADDITIONAL_DOMAIN_NAME}"]
          api_domain_name               = "${API_DOMAIN_NAME}"
          backend_container_port        = 8080
          tls_email                     = "${TLS_EMAIL}"
          ec2_instance_type             = "t3.micro"
          db_instance_class             = "db.t3.micro"
          db_name                       = "${DB_NAME}"
          db_username                   = "${DB_USER}"
          db_password                   = "${{ secrets.RDS_DB_PASSWORD }}"
          db_backup_retention_days      = 7
          allowed_http_cidrs            = ["0.0.0.0/0"]
          enable_frontend_custom_domain = true
          EOF

      - name: Terraform fmt and validate
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${TF_BOOTSTRAP_DIR}" fmt -check -recursive
          terraform -chdir="${TF_BOOTSTRAP_DIR}" init -backend=false -input=false
          terraform -chdir="${TF_BOOTSTRAP_DIR}" validate

          terraform -chdir="${TF_APP_DIR}" fmt -recursive
          terraform -chdir="${TF_APP_DIR}" init -backend=false -input=false
          terraform -chdir="${TF_APP_DIR}" validate

      - name: Terraform bootstrap apply
        shell: bash
        run: |
          set -euo pipefail
          TF_STATE_BUCKET="${{ secrets.TF_STATE_BUCKET_PROD }}"
          TF_LOCK_TABLE="${{ secrets.TF_LOCK_TABLE_PROD }}"
          if [ -z "$TF_LOCK_TABLE" ]; then
            TF_LOCK_TABLE="khaleoapp-terraform-lock"
          fi

          aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null || aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "${AWS_REGION}" --create-bucket-configuration LocationConstraint="${AWS_REGION}"
          aws s3api put-bucket-versioning --bucket "$TF_STATE_BUCKET" --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket "$TF_STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block --bucket "$TF_STATE_BUCKET" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" >/dev/null 2>&1 || aws dynamodb create-table --table-name "$TF_LOCK_TABLE" --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH --billing-mode PAY_PER_REQUEST
          aws dynamodb wait table-exists --table-name "$TF_LOCK_TABLE"

          terraform -chdir="${TF_BOOTSTRAP_DIR}" init -reconfigure -backend-config="backend-prod.hcl" -input=false

          # 🚀 Sửa hàm import: BỎ giấu lỗi (>/dev/null) để GitHub Actions in ra log rõ ràng.
          import_if_exists() {
            local address="$1"
            local resource_id="$2"
            echo "------------------------------------------------"
            echo "Attempting to import: $address"
            echo "Resource ID: $resource_id"
          
            # Chạy import. Nếu thất bại (chưa tồn tại hoặc lỗi cú pháp), in cảnh báo nhưng không làm sập Pipeline.
            terraform -chdir="${TF_BOOTSTRAP_DIR}" import -input=false "$address" "$resource_id" || echo "⚠️ Import failed or resource does not exist yet. Terraform apply will handle it."
          }

          # Import resources (Lưu ý: Dùng dấu nháy đơn cho các resource có chứa index [0])
          import_if_exists "aws_s3_bucket.tf_state" "$TF_STATE_BUCKET"
          import_if_exists "aws_s3_bucket_versioning.tf_state" "$TF_STATE_BUCKET"
          import_if_exists "aws_s3_bucket_server_side_encryption_configuration.tf_state" "$TF_STATE_BUCKET"
          import_if_exists "aws_s3_bucket_public_access_block.tf_state" "$TF_STATE_BUCKET"
          import_if_exists "aws_dynamodb_table.tf_lock" "$TF_LOCK_TABLE"
          import_if_exists 'aws_cloudwatch_log_group.ssm_session[0]' "/aws/ssm/${PROJECT_NAME}/session"
          import_if_exists 'aws_ssm_document.session_preferences[0]' "SSM-SessionManagerRunShell"

          echo "------------------------------------------------"
          echo "Running Bootstrap Apply..."
          terraform -chdir="${TF_BOOTSTRAP_DIR}" apply -input=false -auto-approve

      - name: Terraform app init
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${TF_APP_DIR}" init -reconfigure -backend-config="backend-prod.hcl" -input=false

      - name: Terraform app plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${TF_APP_DIR}" plan -input=false -var-file="env/ci.prod.tfvars" -out="prod.tfplan"

      - name: Terraform app apply/destroy/recreate
        shell: bash
        run: |
          set -euo pipefail

          TF_ACTION="${{ github.event.inputs.action }}"
          if [ -z "$TF_ACTION" ]; then
            TF_ACTION="apply"
          fi

          AUTO_APPROVE="${{ github.event.inputs.auto_approve }}"
          if [ -z "$AUTO_APPROVE" ]; then
            AUTO_APPROVE="true"
          fi

          if [ "$AUTO_APPROVE" != "true" ]; then
            echo "auto_approve=false. Plan completed, skipping mutating action."
            exit 0
          fi

          case "$TF_ACTION" in
            apply)
              terraform -chdir="${TF_APP_DIR}" apply -input=false -auto-approve "prod.tfplan"
              ;;
            destroy)
              terraform -chdir="${TF_APP_DIR}" destroy -input=false -auto-approve -var-file="env/ci.prod.tfvars"
              ;;
            recreate)
              terraform -chdir="${TF_APP_DIR}" destroy -input=false -auto-approve -var-file="env/ci.prod.tfvars"
              terraform -chdir="${TF_APP_DIR}" apply -input=false -auto-approve "prod.tfplan"
              ;;
            *)
              echo "Unsupported action: $TF_ACTION"
              exit 1
              ;;
          esac

      - name: Terraform outputs snapshot
        if: ${{ github.event.inputs.action != 'destroy' }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${TF_APP_DIR}" output -json > "${TF_APP_DIR}/prod-outputs.json"

      - name: Upload Terraform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-prod-${{ github.run_id }}
          path: |
            infra/terraform/app/prod.tfplan
            infra/terraform/app/prod-outputs.json
            infra/terraform/app/env/ci.prod.tfvars
            infra/terraform/app/backend-prod.hcl
            infra/terraform/bootstrap/ci.auto.tfvars
            infra/terraform/bootstrap/backend-prod.hcl
          if-no-files-found: warn

      - name: Determine app deploy chain trigger
        id: deploy_chain
        shell: bash
        run: |
          set -euo pipefail

          TF_ACTION="${{ github.event.inputs.action }}"
          if [ -z "$TF_ACTION" ]; then
            TF_ACTION="apply"
          fi

          AUTO_APPROVE="${{ github.event.inputs.auto_approve }}"
          if [ -z "$AUTO_APPROVE" ]; then
            AUTO_APPROVE="true"
          fi

          SHOULD_TRIGGER="false"
          if [ "$AUTO_APPROVE" = "true" ] && { [ "$TF_ACTION" = "apply" ] || [ "$TF_ACTION" = "recreate" ]; }; then
            SHOULD_TRIGGER="true"
          fi

          echo "tf_action=$TF_ACTION" >> "$GITHUB_OUTPUT"
          echo "auto_approve=$AUTO_APPROVE" >> "$GITHUB_OUTPUT"
          echo "should_trigger=$SHOULD_TRIGGER" >> "$GITHUB_OUTPUT"

  deploy_frontend:
    needs: terraform
    if: ${{ needs.terraform.outputs.should_trigger == 'true' }}
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit

  deploy_backend:
    needs: terraform
    if: ${{ needs.terraform.outputs.should_trigger == 'true' }}
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit



