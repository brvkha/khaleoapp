name: Terraform Staging Infra

on:
  push:
    branches:
      - develop
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-staging.yml'
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        required: true
        default: apply
        options:
          - apply
          - destroy
          - recreate
      auto_approve:
        description: "Apply/Destroy automatically without interactive approval"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: terraform-staging
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  PROJECT_NAME: khaleoapp
  TF_ENV: staging
  TF_BOOTSTRAP_DIR: infra/terraform/bootstrap
  TF_APP_DIR: infra/terraform/app
  ROUTE53_ZONE_NAME: khaleoshop.click
  FRONTEND_DOMAIN_NAME: staging.khaleoshop.click
  FRONTEND_ADDITIONAL_DOMAIN_NAME: stage.khaleoshop.click
  API_DOMAIN_NAME: api-staging.khaleoshop.click

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      tf_action: ${{ steps.deploy_chain.outputs.tf_action }}
      auto_approve: ${{ steps.deploy_chain.outputs.auto_approve }}
      should_trigger: ${{ steps.deploy_chain.outputs.should_trigger }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render CI tfvars and backend config
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.TF_STATE_BUCKET_STAGING }}" ]; then
            echo "Missing required secret: TF_STATE_BUCKET_STAGING"
            exit 1
          fi

          TF_LOCK_TABLE="${{ secrets.TF_LOCK_TABLE_STAGING }}"
          if [ -z "$TF_LOCK_TABLE" ]; then
            TF_LOCK_TABLE="khaleoapp-terraform-lock"
          fi

          TF_BACKEND_KEY="${{ secrets.TF_BACKEND_KEY_STAGING }}"
          if [ -z "$TF_BACKEND_KEY" ]; then
            TF_BACKEND_KEY="khaleoapp/staging/terraform.tfstate"
          fi

          TLS_EMAIL="${{ secrets.TLS_EMAIL_STAGING }}"
          DB_NAME="${{ secrets.RDS_DB_NAME }}"
          if [ -z "$DB_NAME" ]; then
            DB_NAME="khaleoapp"
          fi

          DB_USER="${{ secrets.RDS_DB_USER }}"
          if [ -z "$DB_USER" ]; then
            DB_USER="app_user"
          fi

          if [ -z "${{ secrets.RDS_DB_PASSWORD }}" ]; then
            echo "Missing required secret: RDS_DB_PASSWORD"
            exit 1
          fi

          cat > "${TF_BOOTSTRAP_DIR}/ci.auto.tfvars" <<EOF
          aws_region           = "${AWS_REGION}"
          project              = "${PROJECT_NAME}"
          tf_state_bucket_name = "${{ secrets.TF_STATE_BUCKET_STAGING }}"
          tf_lock_table_name   = "${TF_LOCK_TABLE}"
          EOF

          cat > "${TF_APP_DIR}/backend-staging.hcl" <<EOF
          bucket         = "${{ secrets.TF_STATE_BUCKET_STAGING }}"
          key            = "${TF_BACKEND_KEY}"
          region         = "${AWS_REGION}"
          dynamodb_table = "${TF_LOCK_TABLE}"
          encrypt        = true
          EOF

          cat > "${TF_APP_DIR}/env/ci.staging.tfvars" <<EOF
          aws_region                    = "${AWS_REGION}"
          project                       = "${PROJECT_NAME}"
          environment                   = "${TF_ENV}"
          vpc_cidr                      = "10.0.0.0/16"
          public_subnet_cidr            = "10.0.1.0/24"
          private_subnet_a_cidr         = "10.0.2.0/24"
          private_subnet_b_cidr         = "10.0.3.0/24"
          route53_zone_name             = "${ROUTE53_ZONE_NAME}"
          frontend_domain_name          = "${FRONTEND_DOMAIN_NAME}"
          frontend_additional_domain_names = ["${FRONTEND_ADDITIONAL_DOMAIN_NAME}"]
          api_domain_name               = "${API_DOMAIN_NAME}"
          backend_container_port        = 8080
          tls_email                     = "${TLS_EMAIL}"
          ec2_instance_type             = "t3.micro"
          db_instance_class             = "db.t3.micro"
          db_name                       = "${DB_NAME}"
          db_username                   = "${DB_USER}"
          db_password                   = "${{ secrets.RDS_DB_PASSWORD }}"
          db_backup_retention_days      = 7
          allowed_http_cidrs            = ["0.0.0.0/0"]
          enable_frontend_custom_domain = true
          EOF

      - name: Terraform fmt and validate
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${TF_BOOTSTRAP_DIR}" fmt -check -recursive
          terraform -chdir="${TF_BOOTSTRAP_DIR}" init -input=false
          terraform -chdir="${TF_BOOTSTRAP_DIR}" validate

          terraform -chdir="${TF_APP_DIR}" fmt -check -recursive
          terraform -chdir="${TF_APP_DIR}" init -backend=false -input=false
          terraform -chdir="${TF_APP_DIR}" validate

      - name: Terraform bootstrap apply
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${TF_BOOTSTRAP_DIR}" init -input=false
          terraform -chdir="${TF_BOOTSTRAP_DIR}" apply -input=false -auto-approve

      - name: Terraform app init
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${TF_APP_DIR}" init -reconfigure -backend-config="backend-staging.hcl" -input=false

      - name: Terraform app plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${TF_APP_DIR}" plan -input=false -var-file="env/ci.staging.tfvars" -out="staging.tfplan"

      - name: Terraform app apply/destroy/recreate
        shell: bash
        run: |
          set -euo pipefail

          TF_ACTION="${{ github.event.inputs.action }}"
          if [ -z "$TF_ACTION" ]; then
            TF_ACTION="apply"
          fi

          AUTO_APPROVE="${{ github.event.inputs.auto_approve }}"
          if [ -z "$AUTO_APPROVE" ]; then
            AUTO_APPROVE="true"
          fi

          if [ "$AUTO_APPROVE" != "true" ]; then
            echo "auto_approve=false. Plan completed, skipping mutating action."
            exit 0
          fi

          case "$TF_ACTION" in
            apply)
              terraform -chdir="${TF_APP_DIR}" apply -input=false -auto-approve "staging.tfplan"
              ;;
            destroy)
              terraform -chdir="${TF_APP_DIR}" destroy -input=false -auto-approve -var-file="env/ci.staging.tfvars"
              ;;
            recreate)
              terraform -chdir="${TF_APP_DIR}" destroy -input=false -auto-approve -var-file="env/ci.staging.tfvars"
              terraform -chdir="${TF_APP_DIR}" apply -input=false -auto-approve "staging.tfplan"
              ;;
            *)
              echo "Unsupported action: $TF_ACTION"
              exit 1
              ;;
          esac

      - name: Terraform outputs snapshot
        if: ${{ github.event.inputs.action != 'destroy' }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${TF_APP_DIR}" output -json > "${TF_APP_DIR}/staging-outputs.json"

      - name: Upload Terraform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-staging-${{ github.run_id }}
          path: |
            infra/terraform/app/staging.tfplan
            infra/terraform/app/staging-outputs.json
            infra/terraform/app/env/ci.staging.tfvars
            infra/terraform/app/backend-staging.hcl
            infra/terraform/bootstrap/ci.auto.tfvars
          if-no-files-found: warn

      - name: Determine app deploy chain trigger
        id: deploy_chain
        shell: bash
        run: |
          set -euo pipefail

          TF_ACTION="${{ github.event.inputs.action }}"
          if [ -z "$TF_ACTION" ]; then
            TF_ACTION="apply"
          fi

          AUTO_APPROVE="${{ github.event.inputs.auto_approve }}"
          if [ -z "$AUTO_APPROVE" ]; then
            AUTO_APPROVE="true"
          fi

          SHOULD_TRIGGER="false"
          if [ "$AUTO_APPROVE" = "true" ] && { [ "$TF_ACTION" = "apply" ] || [ "$TF_ACTION" = "recreate" ]; }; then
            SHOULD_TRIGGER="true"
          fi

          echo "tf_action=$TF_ACTION" >> "$GITHUB_OUTPUT"
          echo "auto_approve=$AUTO_APPROVE" >> "$GITHUB_OUTPUT"
          echo "should_trigger=$SHOULD_TRIGGER" >> "$GITHUB_OUTPUT"

  deploy_frontend:
    needs: terraform
    if: ${{ needs.terraform.outputs.should_trigger == 'true' }}
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit

  deploy_backend:
    needs: terraform
    if: ${{ needs.terraform.outputs.should_trigger == 'true' }}
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit


