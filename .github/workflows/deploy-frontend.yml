name: Deploy Frontend

on:
  workflow_call:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  NODE_VERSION: '20'
  TARGET_ENV: prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.khaleoshop.click' }}
        run: npm run build

      - name: Ensure fallback endpoint is handled
        working-directory: frontend
        run: |
          if grep -R "localhost:8080" -n dist/assets; then
            echo "Build artifact still contains localhost:8080 fallback"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        working-directory: frontend
        run: |
          BUCKET="${{ secrets.S3_BUCKET }}"
          if [ -z "$BUCKET" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            BUCKET="khaleoapp-prod-frontend-${ACCOUNT_ID}"
            echo "Auto-discovered S3 bucket: $BUCKET"
          fi
          if [ -z "$BUCKET" ]; then
            echo "BUCKET is still empty"
            exit 1
          fi
          aws s3 sync dist/ s3://${BUCKET} --delete

      - name: Invalidate CloudFront
        run: |
          DIST_ID="${{ secrets.CF_DIST_ID }}"
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            # List all distributions and find the one that has the exact prod domain aliases
            DOMAIN_TO_MATCH="khaleoshop.click"
            DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items!=null] | [?contains(Aliases.Items, '${DOMAIN_TO_MATCH}')].Id | [0]" --output text)
            echo "Auto-discovered CloudFront distribution: $DIST_ID"
          fi
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "Could not resolve CloudFront distribution id."
            exit 1
          fi
          aws cloudfront create-invalidation \
            --distribution-id ${DIST_ID} \
            --paths "/*"

      - name: Notify success
        if: success()
        run: |
          echo "Frontend deployed to production"
